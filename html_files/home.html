<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vitamin/Disease Prediction</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 720px; }
    label { display: block; margin: 6px 0; }
    h2 { margin-top: 18px; }
    #results { margin-top: 24px; display: none; }
    #results.visible { display: block; }
    .result-card {
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 16px 18px;
      background: #f6f8fa;
    }
    .result-card h2 { margin-top: 0; font-size: 1.1rem; }
    .diagnosis { font-size: 1.25rem; font-weight: 600; color: #0969da; margin: 0 0 12px; }
    .explanation { line-height: 1.55; white-space: pre-wrap; margin: 0; }
    .error { color: #cf222e; }
    .loading { color: #57606a; font-style: italic; }
    button[type="submit"] {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <p>
    <a href="/twin">Digital Twin simulation</a> |
    <a href="/login">Login</a> |
    <a href="/register">Register</a>
  </p>
  <h1>Vitamin/Disease Prediction</h1>

  <form id="prediction-form" method="post">
    <label>Age: <input type="number" name="age" min="0" required /></label>

    <label>Gender:
      <select name="gender" required>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
      </select>
    </label>

    <label>BMI: <input type="number" step="0.1" name="bmi" required /></label>

    <label>Smoking status:
      <select name="smoking_status" required>
        <option value="Current">Current</option>
        <option value="Former">Former</option>
        <option value="Never">Never</option>
      </select>
    </label>

    <label>Alcohol consumption:
      <select name="alcohol_consumption">
        <option value="">Not provided</option>
        <option value="Moderate">Moderate</option>
        <option value="Heavy">Heavy</option>
      </select>
    </label>

    <label>Exercise level:
      <select name="exercise_level" required>
        <option value="Active">Active</option>
        <option value="Light">Light</option>
        <option value="Moderate">Moderate</option>
        <option value="Sedentary">Sedentary</option>
      </select>
    </label>

    <label>Diet type:
      <select name="diet_type" required>
        <option value="Omnivore">Omnivore</option>
        <option value="Pescatarian">Pescatarian</option>
        <option value="Vegan">Vegan</option>
        <option value="Vegetarian">Vegetarian</option>
      </select>
    </label>

    <label>Sun exposure:
      <select name="sun_exposure" required>
        <option value="Low">Low</option>
        <option value="Moderate">Moderate</option>
        <option value="High">High</option>
      </select>
    </label>

    <label>Income level:
      <select name="income_level" required>
        <option value="Low">Low</option>
        <option value="Middle">Middle</option>
        <option value="High">High</option>
      </select>
    </label>

    <label>Latitude region:
      <select name="latitude_region" required>
        <option value="Low">Low</option>
        <option value="Mid">Mid</option>
        <option value="High">High</option>
      </select>
    </label>

    <h2>Micronutrient inputs</h2>
    <label>Vitamin A % RDA: <input type="number" step="0.1" name="vitamin_a_percent_rda" required /></label>
    <label>Vitamin C % RDA: <input type="number" step="0.1" name="vitamin_c_percent_rda" required /></label>
    <label>Vitamin D % RDA: <input type="number" step="0.01" name="vitamin_d_percent_rda" required /></label>
    <label>Vitamin E % RDA: <input type="number" step="0.1" name="vitamin_e_percent_rda" required /></label>
    <label>Vitamin B12 % RDA: <input type="number" step="0.1" name="vitamin_b12_percent_rda" required /></label>
    <label>Folate % RDA: <input type="number" step="0.1" name="folate_percent_rda" required /></label>
    <label>Calcium % RDA: <input type="number" step="0.1" name="calcium_percent_rda" required /></label>
    <label>Iron % RDA: <input type="number" step="0.1" name="iron_percent_rda" required /></label>

    <h2>Lab values</h2>
    <label>Hemoglobin (g/dL): <input type="number" step="0.1" name="hemoglobin_g_dl" required /></label>
    <label>Serum vitamin D (ng/mL): <input type="number" step="0.1" name="serum_vitamin_d_ng_ml" required /></label>
    <label>Serum vitamin B12 (pg/mL): <input type="number" step="0.1" name="serum_vitamin_b12_pg_ml" required /></label>
    <label>Serum folate (ng/mL): <input type="number" step="0.1" name="serum_folate_ng_ml" required /></label>

    <label>Symptoms count: <input type="number" step="1" name="symptoms_count" required /></label>
    <label>Symptoms list (semicolon-separated): <input type="text" name="symptoms_list" placeholder="fatigue;memory_problems" /></label>

    <h2>Binary indicators (check if present)</h2>
    <input type="hidden" name="has_night_blindness" value="0">
    <label><input type="checkbox" name="has_night_blindness" value="1"> has_night_blindness</label>
    <input type="hidden" name="has_fatigue" value="0">
    <label><input type="checkbox" name="has_fatigue" value="1"> has_fatigue</label>
    <input type="hidden" name="has_bleeding_gums" value="0">
    <label><input type="checkbox" name="has_bleeding_gums" value="1"> has_bleeding_gums</label>
    <input type="hidden" name="has_bone_pain" value="0">
    <label><input type="checkbox" name="has_bone_pain" value="1"> has_bone_pain</label>
    <input type="hidden" name="has_muscle_weakness" value="0">
    <label><input type="checkbox" name="has_muscle_weakness" value="1"> has_muscle_weakness</label>
    <input type="hidden" name="has_numbness_tingling" value="0">
    <label><input type="checkbox" name="has_numbness_tingling" value="1"> has_numbness_tingling</label>
    <input type="hidden" name="has_memory_problems" value="0">
    <label><input type="checkbox" name="has_memory_problems" value="1"> has_memory_problems</label>
    <input type="hidden" name="has_pale_skin" value="0">
    <label><input type="checkbox" name="has_pale_skin" value="1"> has_pale_skin</label>

    <input type="hidden" name="has_multiple_deficiencies" value="0">
    <label><input type="checkbox" name="has_multiple_deficiencies" value="1"> has_multiple_deficiencies</label>

    <button type="submit" id="submit-btn">Predict &amp; Explain</button>
  </form>

  <section id="results" aria-live="polite">
    <div class="result-card">
      <h2>Results</h2>
      <p id="result-status" class="loading" hidden>Generating explanation…</p>
      <p id="result-diagnosis" class="diagnosis" hidden></p>
      <p id="result-explanation" class="explanation" hidden></p>
      <p id="result-error" class="error" hidden></p>
    </div>
  </section>

  <script>
    const form = document.getElementById("prediction-form");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("result-status");
    const diagnosisEl = document.getElementById("result-diagnosis");
    const explanationEl = document.getElementById("result-explanation");
    const errorEl = document.getElementById("result-error");
    const submitBtn = document.getElementById("submit-btn");

    function hideResultFields() {
      statusEl.hidden = true;
      diagnosisEl.hidden = true;
      explanationEl.hidden = true;
      errorEl.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideResultFields();
      results.classList.add("visible");
      statusEl.hidden = false;
      statusEl.textContent = "Generating explanation…";
      submitBtn.disabled = true;

      form.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        const hidden = form.querySelector(`input[type="hidden"][name="${checkbox.name}"]`);
        if (hidden) {
          hidden.disabled = checkbox.checked;
        }
      });

      try {
        const response = await fetch("/explain", {
          method: "POST",
          body: new FormData(form),
        });
        const data = await response.json();

        statusEl.hidden = true;
        if (!response.ok || data.error) {
          errorEl.hidden = false;
          errorEl.textContent = data.error || "Request failed.";
          return;
        }

        diagnosisEl.hidden = false;
        diagnosisEl.textContent = data.diagnosis;
        explanationEl.hidden = false;
        explanationEl.textContent = data.explanation;
      } catch (err) {
        statusEl.hidden = true;
        errorEl.hidden = false;
        errorEl.textContent = "Could not reach the server. Is the app running?";
      } finally {
        submitBtn.disabled = false;
        form.querySelectorAll('input[type="hidden"]').forEach((input) => {
          input.disabled = false;
        });
      }
    });
  </script>

</body>
</html>
